# This is a basic workflow to help you get started with Actions

name: Build kernel

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "master" branch
  push:
    tags:
      - '*'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    name: Build kernel
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4
        with:
          ref: lineage-22.2
          
      - name: Update & install dependencies
        run: |
          sudo apt update
          sudo apt install curl aria2 git fakeroot build-essential ncurses-dev xz-utils libssl-dev bc flex libelf-dev bison build-essential dpkg-dev findutils bc rsync kmod cpio bison flex libssl-dev binutils-aarch64-linux-gnu lz4 procps -y
          sudo aria2c -x 10 -s 10 -j 10 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/67af9f576276f27363074c4388e2cf0963bab6df/clang-r563880b.tar.gz -o clang.tar.gz -d /
          sudo mkdir /clang
          sudo tar -xvf /clang.tar.gz -C /clang
          sudo touch /clang/bin/aarch64-linux-gnu-elfedit
          sudo chmod +x /clang/bin/aarch64-linux-gnu-elfedit
          sudo git clone https://github.com/cupid-development/android_kernel_xiaomi_sm8450-devicetrees ../android_kernel_xiaomi_sm8450-devicetrees
          sudo git clone https://github.com/cupid-development/android_kernel_xiaomi_sm8450-modules ../android_kernel_xiaomi_sm8450-modules

      - name: Set Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 8

      - name: Setup KernelSU Next
        run: |
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -
          
      - name: Build kernel
        run: |
          export PATH=/clang/bin:$PATH
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 O=out gki_defconfig
          ./scripts/kconfig/merge_config.sh -m out/.config arch/arm64/configs/vendor/waipio_GKI.config arch/arm64/configs/vendor/xiaomi_GKI.config arch/arm64/configs/vendor/marble_GKI.config arch/arm64/configs/vendor/debugfs.config arch/arm64/configs/vendor/lxc.config
          mv .config out/ -v
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 O=out olddefconfig
          ./scripts/kconfig/merge_config.sh -m out/.config arch/arm64/configs/vendor/waipio_GKI.config arch/arm64/configs/vendor/xiaomi_GKI.config arch/arm64/configs/vendor/marble_GKI.config arch/arm64/configs/vendor/debugfs.config arch/arm64/configs/vendor/lxc.config
          mv .config out/ -v
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 O=out -j$(nproc --all)
          #make ARCH=arm64 LLVM=1 LLVM_IAS=1 O=out -j2
          
      - name: Move kernel to out directory
        run: |
          sudo mkdir /out
          sudo cp ./out/arch/arm64/boot/Image /out/
          ls /out
          
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-kernel
          path: /out/*
          if-no-files-found: error
          retention-days: 1

  prepare:
    runs-on: ubuntu-latest
    name: Create GitHub release
    needs: build

    steps:
      - name: Delete old latest release
        uses: dev-drprasad/delete-tag-and-release@v1.1
        with:
          delete_release: true # default: false
          tag_name: latest # tag name to delete
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag latest
        uses: tvdias/github-tagger@v0.0.1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          tag: latest

  publish:
    runs-on: ubuntu-latest
    needs: prepare

    name: Publish linux-kernel

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: out

      - name: Create latest release
        uses: softprops/action-gh-release@v2.2.1
        with:
          files: out/linux-kernel/*
          tag_name: latest
          draft: false
          prerelease: false
